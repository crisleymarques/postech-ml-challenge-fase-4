[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "postech-ml-challenge-fase-4"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "evidently>=0.7.23",
    "kagglehub>=1.0.3,<2",
    "numpy>=2.5.4",
    "pandas>=2.2,<3.1",
    "pandera[pandas]>=0.35.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "streamlit>=1.66.1",
]

[project.scripts]
gerar-predicoes = "monitoramento.predicao.cli:main"
detectar-drift = "monitoramento.drift.deteccao.cli:main"
simular-data-drift = "monitoramento.simulacao.data_drift.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.venv/pytest-tmp"
